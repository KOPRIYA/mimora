name: Deploy MIMORA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: npm run check
      - name: Run behavioral tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish MIMORA
        id: deployment
        uses: actions/deploy-pages@v4
